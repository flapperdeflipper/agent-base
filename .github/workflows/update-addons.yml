---
# When a new agent-base release is published, open a pull request in
# flapperdeflipper/addons that repoints the layered add-ons (ha_opencode,
# ha_openchamber, terminal) at the new image version. Requires the
# ADDONS_REPO_TOKEN secret (a PAT with repo scope on flapperdeflipper/addons).
name: Update add-ons

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "agent-base version (without v)"
        required: true
        type: string

concurrency:
  group: update-addons
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    name: Open add-on update PR
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7

      - name: Check out the addons repository
        uses: actions/checkout@v7
        with:
          repository: flapperdeflipper/addons
          token: ${{ secrets.ADDONS_REPO_TOKEN }}
          path: addons

      - name: Resolve the released version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ inputs.version }}"
          fi
          VERSION="${VERSION#v}"
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a semver tag: ${VERSION}" >&2; exit 1; }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Bump the add-on base pins
        working-directory: addons
        run: ../scripts/update-addons.sh "${{ steps.version.outputs.version }}"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.ADDONS_REPO_TOKEN }}
          path: addons
          branch: update/agent-base-${{ steps.version.outputs.version }}
          delete-branch: true
          title: "chore: agent-base ${{ steps.version.outputs.version }} roll-up"
          commit-message: "chore: base image agent-base ${{ steps.version.outputs.version }}"
          body: |
            Automated roll-up: repoint the add-ons layered on
            [agent-base](https://github.com/flapperdeflipper/agent-base) at release
            `${{ steps.version.outputs.version }}` and bump their patch versions.

            Source release: ${{ github.event.release.html_url || format('https://github.com/flapperdeflipper/agent-base/releases/tag/v{0}', steps.version.outputs.version) }}

            Pins updated in `Dockerfile` + `build.yaml` for: `ha_opencode`,
            `ha_openchamber`, `terminal`. Builder CI runs on this PR; merge when green.
          labels: |
            base-image-update
