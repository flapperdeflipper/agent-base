---
# Ping the central Renovate runner (flapperdeflipper/renovate) whenever an
# agent-base release is published. Renovate then opens a PR in
# flapperdeflipper/addons that repins the layered add-ons (ha_opencode,
# ha_openchamber, terminal) at the new image version and bumps their
# config.yaml versions + changelogs via the post-upgrade task there.
# Replaces the former update-addons.yml roll-up (retired: Renovate owns the
# flow now).
name: Trigger Renovate

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Renovate run
        env:
          GH_TOKEN: ${{ secrets.RENOVATE_DISPATCH_TOKEN }}
        run: |
          gh api repos/flapperdeflipper/renovate/dispatches \
            -X POST \
            -f event_type=renovate-trigger \
            -F 'client_payload[source_repository]=${{ github.repository }}' \
            -F 'client_payload[release_url]=${{ github.event.release.html_url }}'
